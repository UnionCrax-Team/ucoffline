[Settings]
; AppID to report to the game (default: 480 - Half-Life)
AppId=480

; Original AppID override (default: 0 = disabled)
ogAppId=0

; Force all ownership/license checks to pass (default: true)
ForceOwnership=true

; Enable fake auth ticket generation (default: false)
EmulateTicket=false

; Steam stub detection bypass (default: false)
GetStubbedLol=false

; Enable friend list features (default: true)
EnableFriends=true

; Enable Steam Cloud emulation (default: false)
EnableCloud=false

; Enable overlay (default: false)
EnableOverlay=false

; Custom log file path (default: empty = %TEMP%\uc_offline.log)
; Use a full path like D:\logs\uc_offline.log
LogPath=

; DLC AppIDs to unlock, comma-separated (default: empty)
; Example: UnlockDLC=12345,67890
UnlockDLC=

; Plugin folder name (relative to game exe, default: empty = disabled)
; All .dll files in this folder will be loaded
PluginsFolder=

[User]
; Your SteamID64 (default: 76561197960265728)
SteamID=76561197960265728

; Display name (default: User)
PersonaName=User

; Online state: 0=Offline, 1=Online, 2=Busy, 3=Away, 4=Snooze,
;               5=LookingToTrade, 6=LookingToPlay (default: 1)
PersonaState=1

; Steam level shown to the game (default: 100)
SteamLevel=100

; Game badge level (default: 1)
GameBadgeLevel=1

; Phone verified (default: true)
PhoneVerified=true

; Two-factor auth enabled (default: true)
TwoFactorEnabled=true

; Behind NAT (default: false)
BehindNAT=false

; Account flags bitmask (default: 0)
AccountFlags=0

; Two-letter IP country code (default: US)
IPCountry=US

; Steam UI language (default: english)
SteamUILanguage=english

; Universe: 0=Invalid, 1=Public, 2=Beta, 3=Internal, 4=Dev (default: 1)
Universe=1

; Server real-time timestamp (default: current time)
ServerRealTime=

[Cloud]
; Path for Steam Cloud save data emulation (default: empty = disabled)
CloudPath=

[Friends]
; Friend list entries: Friend0Name, Friend0ID, Friend1Name, Friend1ID, etc.
; Up to 64 friends supported (Friend0Name through Friend63Name / Friend63ID)
; Example:
; Friend0Name=Friend1
; Friend0ID=76561197960265729
; Friend1Name=Friend2
; Friend1ID=76561197960265730
